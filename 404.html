<!DOCTYPE html>

  <style>
    .lost {

    }
    .lost .goutte-mark { margin-bottom: 2rem; animation: preloader-drop 1.4s var(--ease-pipette) infinite alternate; }

      text-transform: uppercase; color: var(--muted); margin-bottom: 1.4rem;
    }
    .lost h1 {
      font-family: var(--font-display); font-weight: 560; font-size: var(--step-4);
      line-height: 1.02; letter-spacing: -0.02em; margin-bottom: 1rem; max-width: 18ch;
    }
    .lost h1 em { font-style: italic; color: var(--accent); }
    .lost p { color: var(--muted); margin-bottom: 2rem; max-width: 46ch; }
  </style>
</head>
<body>
  <div class="lost">
    <span class="goutte-mark" aria-hidden="true"></span>
    <p class="code-line">ZW—404 / SAMPLE NOT FOUND</p>
